name: Publish to npm

# Auto-publishes @conjureos/ui to npm on push to `main`, but only when the
# version in package.json isn't already on npm (re-pushes are no-ops).
#
# Auth: npm Trusted Publishing (OIDC) — NO token. Requires the package's Trusted
# Publisher on npmjs.com to point at THIS workflow file (publish-npm.yml).
# Node 24 is used on purpose: its bundled npm (>= 11.5.1) performs the OIDC
# handshake; Node 20's npm 10 does not. Publishes with provenance (public repo).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (+ provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 → npm >= 11.5.1 (does the OIDC handshake) + registry-url so npm
      # knows the registry. Matches npm's official trusted-publishing recipe.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: npm version (needs >= 11.5.1 for OIDC)
        run: npm -v

      - name: Install dependencies
        run: npm install

      - name: Skip if this version is already published
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          local="$(node -p "require('./package.json').version")"
          remote="$(npm view "$name@$local" version 2>/dev/null || echo "")"
          if [ "$remote" = "$local" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$local is already on npm — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $name@$local."
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      # Token auth (NPM_TOKEN). OIDC wouldn't engage on the runner; revisit later.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
