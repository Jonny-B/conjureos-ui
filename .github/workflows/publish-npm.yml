name: Publish to npm

# Auto-publishes @conjureos/ui to npm on push to `main`, but only when the
# version in package.json isn't already on npm (re-pushes are no-ops). So a
# release is just: bump version, push to main.
#
# Auth: npm Trusted Publishing (OIDC) — NO token/secret. For this to work, the
# package's Trusted Publisher on npmjs.com must point at THIS workflow file
# (publish-npm.yml) with the environment field left blank. Publishes with
# provenance (public repo).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (+ provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10; Trusted Publishing (OIDC) needs npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Skip if this version is already published
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          local="$(node -p "require('./package.json').version")"
          remote="$(npm view "$name@$local" version 2>/dev/null || echo "")"
          if [ "$remote" = "$local" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$local is already on npm — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $name@$local."
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish (Trusted Publishing — no token)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
