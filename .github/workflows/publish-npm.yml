name: Publish to npm

# Auto-publishes @conjureos/ui to npm on every push to `main` — but ONLY when
# package.json's version isn't already on npm. So "doing a release" is just:
# bump the version, push to main. Re-pushing without a bump is a no-op.
#
# Requires an `NPM_TOKEN` repo secret: an npm automation/granular token with
# publish access to the @conjureos scope.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Skip if this version is already published
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          local="$(node -p "require('./package.json').version")"
          remote="$(npm view "$name@$local" version 2>/dev/null || echo "")"
          if [ "$remote" = "$local" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$local is already on npm — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $name@$local."
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
